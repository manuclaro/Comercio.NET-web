<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00695c">
    <title>Administrador de Productos - Comercio.NET</title>
    <link rel="stylesheet" href="/css/productos.css">
    <style>
        .admin-toolbar { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem; }
        .btn-nuevo { background:#00897b; color:#fff; border:none; padding:.55rem 1.2rem; border-radius:6px; cursor:pointer; font-size:.95rem; font-weight:600; transition:background .2s; }
        .btn-nuevo:hover { background:#00695c; }
        .badge-activo   { background:#e8f5e9; color:#2e7d32; padding:.2rem .55rem; border-radius:12px; font-size:.78rem; font-weight:600; }
        .badge-inactivo { background:#ffebee; color:#c62828; padding:.2rem .55rem; border-radius:12px; font-size:.78rem; font-weight:600; }
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:.88rem; }
        th { background:#00695c; color:#fff; padding:.6rem .8rem; text-align:left; white-space:nowrap; }
        td { padding:.55rem .8rem; border-bottom:1px solid #e0e0e0; vertical-align:middle; }
        tr:hover td { background:#f5f5f5; cursor:pointer; }
        .text-right { text-align:right; }
        .text-center { text-align:center; }
        .pagination { display:flex; justify-content:center; align-items:center; gap:1rem; margin-top:1.2rem; }
        .pagination button { background:#fff; border:1px solid #ccc; padding:.4rem .9rem; border-radius:6px; cursor:pointer; }
        .pagination button:disabled { opacity:.4; cursor:default; }
        .pagination span { font-size:.9rem; }
        /* Modal */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; }
        .modal-box { background:#fff; border-radius:10px; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,.25); }
        .modal-header { background:linear-gradient(135deg,#00897b,#00695c); color:#fff; padding:1rem 1.2rem; border-radius:10px 10px 0 0; display:flex; justify-content:space-between; align-items:center; }
        .modal-header h3 { margin:0; font-size:1.1rem; }
        .modal-body { padding:1.2rem; display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
        .modal-body .full { grid-column:1/-1; }
        .form-grupo label { display:block; font-size:.82rem; font-weight:600; color:#555; margin-bottom:.25rem; }
        .form-grupo input, .form-grupo select { width:100%; padding:.5rem .7rem; border:1px solid #ccc; border-radius:6px; font-size:.92rem; }
        .form-grupo input:focus, .form-grupo select:focus { outline:none; border-color:#00897b; box-shadow:0 0 0 2px rgba(0,137,123,.15); }
        .modal-footer { padding:1rem 1.2rem; display:flex; justify-content:flex-end; gap:.7rem; border-top:1px solid #eee; }
        .btn-cancel { background:#fff; border:1px solid #ccc; padding:.5rem 1.1rem; border-radius:6px; cursor:pointer; font-size:.92rem; }
        .btn-save   { background:#00897b; color:#fff; border:none; padding:.5rem 1.3rem; border-radius:6px; cursor:pointer; font-size:.92rem; font-weight:600; }
        .btn-save:hover { background:#00695c; }
        .btn-close-modal { background:transparent; border:none; color:#fff; font-size:1.3rem; cursor:pointer; line-height:1; padding:0; }
        .msg-ok  { background:#e8f5e9; color:#2e7d32; padding:.6rem 1rem; border-radius:6px; margin-bottom:.8rem; font-size:.9rem; }
        .msg-err { background:#ffebee; color:#c62828; padding:.6rem 1rem; border-radius:6px; margin-bottom:.8rem; font-size:.9rem; }
        .btn-danger { background:#c62828; color:#fff; border:none; padding:.35rem .75rem; border-radius:6px; cursor:pointer; font-size:.82rem; }
        .btn-danger:hover { background:#b71c1c; }
        .row-actions { display:flex; gap:.4rem; }
        .btn-edit { background:#1565c0; color:#fff; border:none; padding:.35rem .6rem; border-radius:6px; cursor:pointer; font-size:1rem; line-height:1; }
        .btn-edit:hover { background:#0d47a1; }
        .hint { color:#777; font-size:.82rem; margin-bottom:.5rem; }
    </style>
</head>
<body>
<div class="page-wrapper">
    <header class="page-header">
        <a href="/dashboard.html" class="btn-back">Volver</a>
        <div class="header-title">
            <div>
                <h1>Administrador de Productos</h1>
                <p>Alta, baja y modificacion completa</p>
            </div>
        </div>
        <div class="header-user">
            <span id="nombreUsuario"></span>
            <button class="btn-logout" id="btnCerrarSesion">Cerrar Sesion</button>
        </div>
    </header>

    <main class="page-main">

        <div class="admin-toolbar">
            <div class="search-box" style="flex:1;min-width:200px;margin:0;">
                <input type="text" id="txtBuscar" placeholder="Buscar por codigo, descripcion, rubro o marca..." autocomplete="off" />
                <button id="btnBuscar" class="btn-search">Buscar</button>
            </div>
            <button id="btnNuevo" class="btn-nuevo">+ Nuevo Producto</button>
        </div>

        <div id="loading" class="loading" style="display:none;">
            <div class="spinner"></div><p>Cargando...</p>
        </div>
        <div id="msgGlobal" style="display:none;"></div>

        <div id="resultados">
            <p id="contadorResultados" class="contador hint"></p>
            <div class="table-wrapper">
                <table id="tablaProductos">
                    <thead>
                        <tr>
                            <th>Codigo</th>
                            <th>Descripcion</th>
                            <th>Marca</th>
                            <th class="text-right">Costo</th>
                            <th class="text-center">Margen%</th>
                            <th class="text-right">Precio</th>
                            <th class="text-center">Stock</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center">Editar</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyProductos"></tbody>
                </table>
            </div>
            <div class="pagination" id="paginacion">
                <button id="btnAnterior" disabled>&lt;&lt; Anterior</button>
                <span id="paginaInfo">Pagina 1 de 1</span>
                <button id="btnSiguiente">Siguiente &gt;&gt;</button>
            </div>
        </div>

    </main>

    <footer class="page-footer">
        <p>Comercio.NET - Administrador de Productos</p>
    </footer>
</div>

<!-- MODAL EDICION / CREACION -->
<div id="modalProducto" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitulo">Editar Producto</h3>
            <button class="btn-close-modal" id="btnCerrarModal">X</button>
        </div>
        <div class="modal-body" id="modalBody">
            <div id="modalMsg" style="display:none;" class="full"></div>

            <div class="form-grupo full">
                <label>Codigo *</label>
                <input type="text" id="fCodigo" placeholder="Ej: 1234 o 7791234..." maxlength="50" />
            </div>
            <div class="form-grupo full">
                <label>Descripcion *</label>
                <input type="text" id="fDescripcion" placeholder="Nombre del producto..." maxlength="200" />
            </div>
            <div class="form-grupo">
                <label>Rubro</label>
                <input type="text" id="fRubro" list="listaRubros" placeholder="Ej: Lacteos" maxlength="100" />
                <datalist id="listaRubros"></datalist>
            </div>
            <div class="form-grupo">
                <label>Marca</label>
                <input type="text" id="fMarca" list="listaMarcas" placeholder="Ej: La Serenisima" maxlength="100" />
                <datalist id="listaMarcas"></datalist>
            </div>
            <div class="form-grupo full">
                <label>Proveedor</label>
                <input type="text" id="fProveedor" placeholder="Nombre del proveedor..." maxlength="100" />
            </div>
            <div class="form-grupo">
                <label>Margen sobre costo (%)</label>
                <input type="number" id="fPorcentaje" min="0" step="1" placeholder="Ej: 30" />
            </div>
            <div class="form-grupo">
                <label>Costo ($)</label>
                <input type="number" id="fCosto" min="0" step="0.01" placeholder="0.00" />
            </div>
            <div class="form-grupo">
                <label>Precio de Venta ($)</label>
                <input type="number" id="fPrecio" min="0" step="0.01" placeholder="0.00" />
            </div>
            <div class="form-grupo">
                <label>Stock</label>
                <input type="number" id="fStock" min="0" step="1" placeholder="0" />
            </div>
            <div class="form-grupo">
                <label>Alicuota IVA (%)</label>
                <select id="fIva">
                    <option value="0">Exento (0%)</option>
                    <option value="10.5">10.5%</option>
                    <option value="21" selected>21%</option>
                    <option value="27">27%</option>
                </select>
            </div>
            <div class="form-grupo">
                <label>Permite editar precio?</label>
                <select id="fEditarPrecio">
                    <option value="true">Si</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-grupo" id="grupoActivo">
                <label>Estado</label>
                <select id="fActivo">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>
            <div class="form-grupo">
                <label>Permite acumular?</label>
                <select id="fPermiteAcumular">
                    <option value="true">Si</option>
                    <option value="false">No</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" id="btnCancelarModal">Cancelar</button>
            <button class="btn-save" id="btnGuardar">Guardar</button>
        </div>
    </div>
</div>

<script src="/js/admin-productos.js"></script>
</body>
</html>
