<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0078d7">
    <title>Historial de Cierres - Comercio.NET</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/ventas.css" />
</head>
<body>

    <header class="page-header">
        <a href="/dashboard.html" class="btn-back">&larr; Volver</a>
        <div class="header-title">
            <div>
                <h1>Historial de Cierres</h1>
                <p>Consulta de cierres de turno</p>
            </div>
        </div>
        <div class="header-user">
            <span id="nombreUsuario"></span>
            <button class="btn-logout" id="btnCerrarSesion">Cerrar Sesion</button>
        </div>
    </header>

    <main class="page-main" style="max-width: 1000px;">

        <div class="filtro-box">
            <div class="filtro-grupo">
                <label for="fechaDesde">Desde</label>
                <input type="date" id="fechaDesde" />
            </div>
            <div class="filtro-grupo">
                <label for="fechaHasta">Hasta</label>
                <input type="date" id="fechaHasta" />
            </div>
            <div class="filtro-grupo">
                <label for="filtroCajero">Cajero</label>
                <select id="filtroCajero">
                    <option value="">Todos</option>
                </select>
            </div>
            <button class="btn-consultar" id="btnBuscar">Buscar</button>
        </div>

        <div class="tabla-ventas-container">
            <table id="tablaHistorial">
                <thead>
                    <tr>
                        <th>Turno</th>
                        <th>Cajero</th>
                        <th>Fecha Cierre</th>
                        <th>Total Esperado</th>
                        <th>Total Declarado</th>
                        <th>Diferencia</th>
                    </tr>
                </thead>
                <tbody id="bodyHistorial"></tbody>
            </table>
            <p id="mensajeVacio" class="mensaje-vacio" style="display:none">No se encontraron cierres para los filtros seleccionados.</p>
        </div>

    </main>

    <!-- Modal Detalle -->
    <div id="modalDetalle" class="modal-overlay" style="display:none">
        <div class="modal-content" style="max-width:650px;">
            <div class="modal-header">
                <h3 id="modalTitulo">Detalle del Cierre</h3>
                <button class="btn-close" onclick="cerrarModal()">&times;</button>
            </div>
            <div style="padding:1.2rem 1.5rem;overflow-y:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:0.88rem;">
                    <thead>
                        <tr style="background:#f5f5f5;">
                            <th style="padding:8px 10px;text-align:left;">Medio de Pago</th>
                            <th style="padding:8px 10px;text-align:right;">Esperado</th>
                            <th style="padding:8px 10px;text-align:right;">Declarado</th>
                            <th style="padding:8px 10px;text-align:right;">Diferencia</th>
                            <th style="padding:8px 10px;text-align:center;">Transacciones</th>
                        </tr>
                    </thead>
                    <tbody id="modalDetalleBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const token = localStorage.getItem('auth_token');
        if (!token) { window.location.href = '/login.html'; return; }

        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        let dataCierres = [];

        // Usuario en header
        document.getElementById('nombreUsuario').textContent = localStorage.getItem('usuario_nombre') || '';
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/login.html';
        });

        // Default: hoy (fecha local)
        const ahora = new Date();
        const hoy = ahora.getFullYear() + '-' + String(ahora.getMonth()+1).padStart(2,'0') + '-' + String(ahora.getDate()).padStart(2,'0');
        document.getElementById('fechaDesde').value = hoy;
        document.getElementById('fechaHasta').value = hoy;

        // Cargar cajeros
        async function cargarCajeros() {
            try {
                const res = await fetch('/api/turno/cajeros', { headers });
                if (!res.ok) return;
                const cajeros = await res.json();
                const select = document.getElementById('filtroCajero');
                cajeros.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    select.appendChild(opt);
                });
            } catch(e) {}
        }
        cargarCajeros();

        function formatMoney(n) {
            return '$ ' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2 });
        }

        function formatFecha(str) {
            if (!str) return '-';
            const d = new Date(str);
            return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        }

        async function buscar() {
            const desde = document.getElementById('fechaDesde').value;
            const hasta = document.getElementById('fechaHasta').value;
            if (!desde || !hasta) return;

            const tbody = document.getElementById('bodyHistorial');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#999;">Cargando...</td></tr>';
            document.getElementById('mensajeVacio').style.display = 'none';

            const cajero = document.getElementById('filtroCajero').value;
            const cajeroParam = cajero ? `&cajero=${encodeURIComponent(cajero)}` : '';

            try {
                const res = await fetch(`/api/turno/historial-cierres?desde=${desde}&hasta=${hasta}${cajeroParam}`, { headers });
                if (!res.ok) throw new Error('Error');
                dataCierres = await res.json();

                if (!dataCierres.length) {
                    tbody.innerHTML = '';
                    document.getElementById('mensajeVacio').style.display = 'block';
                    return;
                }

                tbody.innerHTML = dataCierres.map((cierre, idx) => {
                    const totalEsp = cierre.detalles.reduce((s, d) => s + (d.totalEsperado || 0), 0);
                    const totalDecl = cierre.detalles.reduce((s, d) => s + (d.totalDeclarado || 0), 0);
                    const dif = totalDecl - totalEsp;
                    const difStyle = dif < 0 ? 'color:#c62828;font-weight:600;' : dif > 0 ? 'color:#2e7d32;font-weight:600;' : '';

                    return `<tr data-idx="${idx}" style="cursor:pointer;">
                        <td>#${cierre.idTurno}</td>
                        <td>${cierre.usuarioCierre || '-'}</td>
                        <td>${formatFecha(cierre.fechaCierre)}</td>
                        <td>${formatMoney(totalEsp)}</td>
                        <td>${formatMoney(totalDecl)}</td>
                        <td style="${difStyle}">${formatMoney(dif)}</td>
                    </tr>`;
                }).join('');

                // Click en filas
                tbody.querySelectorAll('tr').forEach(tr => {
                    tr.addEventListener('click', () => {
                        mostrarDetalle(dataCierres[parseInt(tr.dataset.idx)]);
                    });
                });

            } catch (err) {
                tbody.innerHTML = '';
                document.getElementById('mensajeVacio').textContent = 'Error al cargar historial.';
                document.getElementById('mensajeVacio').style.display = 'block';
            }
        }

        function mostrarDetalle(cierre) {
            document.getElementById('modalTitulo').textContent = `Turno #${cierre.idTurno} — ${cierre.usuarioCierre || '-'} — ${formatFecha(cierre.fechaCierre)}`;

            const totalEsp = cierre.detalles.reduce((s, d) => s + (d.totalEsperado || 0), 0);
            const totalDecl = cierre.detalles.reduce((s, d) => s + (d.totalDeclarado || 0), 0);
            const totalDif = totalDecl - totalEsp;
            const totalDifStyle = totalDif < 0 ? 'color:#c62828;font-weight:700;' : totalDif > 0 ? 'color:#2e7d32;font-weight:700;' : 'font-weight:700;';

            let html = cierre.detalles.map(d => {
                const difStyle = d.diferencia < 0 ? 'color:#c62828;font-weight:600;' : d.diferencia > 0 ? 'color:#2e7d32;font-weight:600;' : '';
                return `<tr>
                    <td style="padding:8px 10px;">${d.medioPago}</td>
                    <td style="padding:8px 10px;text-align:right;">${formatMoney(d.totalEsperado)}</td>
                    <td style="padding:8px 10px;text-align:right;">${formatMoney(d.totalDeclarado)}</td>
                    <td style="padding:8px 10px;text-align:right;${difStyle}">${formatMoney(d.diferencia)}</td>
                    <td style="padding:8px 10px;text-align:center;">${d.cantidadTransacciones}</td>
                </tr>`;
            }).join('');

            html += `<tr style="border-top:2px solid #ddd;">
                <td style="padding:8px 10px;font-weight:700;">TOTAL</td>
                <td style="padding:8px 10px;text-align:right;font-weight:700;">${formatMoney(totalEsp)}</td>
                <td style="padding:8px 10px;text-align:right;font-weight:700;">${formatMoney(totalDecl)}</td>
                <td style="padding:8px 10px;text-align:right;${totalDifStyle}">${formatMoney(totalDif)}</td>
                <td></td>
            </tr>`;

            document.getElementById('modalDetalleBody').innerHTML = html;
            document.getElementById('modalDetalle').style.display = 'flex';
        }

        window.cerrarModal = function() {
            document.getElementById('modalDetalle').style.display = 'none';
        };

        document.getElementById('modalDetalle').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) cerrarModal();
        });

        document.getElementById('btnBuscar').addEventListener('click', buscar);
        buscar();
    })();
    </script>
</body>
</html>
