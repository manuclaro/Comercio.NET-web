<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Comercio.NET</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .page-header { background:linear-gradient(135deg,#3f51b5,#283593); }
        .admin-toolbar { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:1rem; }
        .btn-nuevo { background:#3f51b5; color:#fff; border:none; padding:.55rem 1.2rem; border-radius:6px; cursor:pointer; font-size:.95rem; font-weight:600; }
        .btn-nuevo:hover { background:#283593; }
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:.88rem; }
        th { background:#3f51b5; color:#fff; padding:.6rem .8rem; text-align:left; white-space:nowrap; }
        td { padding:.55rem .8rem; border-bottom:1px solid #e0e0e0; }
        tr:hover td { background:#f5f5f5; }
        .row-actions { display:flex; gap:.4rem; }
        .btn-edit   { background:#1565c0; color:#fff; border:none; padding:.3rem .7rem; border-radius:5px; cursor:pointer; font-size:.82rem; }
        .btn-danger { background:#c62828; color:#fff; border:none; padding:.3rem .7rem; border-radius:5px; cursor:pointer; font-size:.82rem; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; }
        .modal-box { background:#fff; border-radius:10px; width:100%; max-width:500px; box-shadow:0 8px 32px rgba(0,0,0,.25); }
        .modal-header { background:linear-gradient(135deg,#3f51b5,#283593); color:#fff; padding:1rem 1.2rem; border-radius:10px 10px 0 0; display:flex; justify-content:space-between; align-items:center; }
        .modal-header h3 { margin:0; font-size:1.1rem; }
        .modal-body { padding:1.2rem; display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
        .modal-body .full { grid-column:1/-1; }
        .form-grupo label { display:block; font-size:.82rem; font-weight:600; color:#555; margin-bottom:.25rem; }
        .form-grupo input { width:100%; padding:.5rem .7rem; border:1px solid #ccc; border-radius:6px; font-size:.92rem; }
        .form-grupo input:focus { outline:none; border-color:#3f51b5; }
        .modal-footer { padding:1rem 1.2rem; display:flex; justify-content:flex-end; gap:.7rem; border-top:1px solid #eee; }
        .btn-cancel { background:#fff; border:1px solid #ccc; padding:.5rem 1.1rem; border-radius:6px; cursor:pointer; }
        .btn-save   { background:#3f51b5; color:#fff; border:none; padding:.5rem 1.3rem; border-radius:6px; cursor:pointer; font-weight:600; }
        .btn-close-modal { background:transparent; border:none; color:#fff; font-size:1.3rem; cursor:pointer; }
        .msg-ok  { background:#e8f5e9; color:#2e7d32; padding:.6rem 1rem; border-radius:6px; margin-bottom:.8rem; }
        .msg-err { background:#ffebee; color:#c62828; padding:.6rem 1rem; border-radius:6px; margin-bottom:.8rem; }
        .search-box { display:flex; gap:.5rem; flex:1; }
        .search-box input { flex:1; padding:.5rem .8rem; border:1px solid #ccc; border-radius:6px; font-size:.95rem; }
        .btn-search { background:#3f51b5; color:#fff; border:none; padding:.5rem 1rem; border-radius:6px; cursor:pointer; }
        .loading { text-align:center; padding:2rem; color:#666; }
    </style>
</head>
<body>
<div class="page-wrapper">
    <header class="page-header">
        <a href="/dashboard.html" class="btn-back">Volver</a>
        <div class="header-title">
            <span></span>
            <div><h1>Proveedores</h1><p>Alta, baja y modificación</p></div>
        </div>
        <div class="header-user">
            <span id="nombreUsuario"></span>
            <button class="btn-logout" id="btnCerrarSesion">Cerrar Sesión</button>
        </div>
    </header>

    <main class="page-main">
        <div class="admin-toolbar">
            <div class="search-box">
                <input type="text" id="txtBuscar" placeholder="Buscar por nombre o CUIT..." />
                <button id="btnBuscar" class="btn-search">Buscar</button>
            </div>
            <button id="btnNuevo" class="btn-nuevo">Nuevo Proveedor</button>
        </div>

        <div id="loading" class="loading" style="display:none;">Cargando...</div>
        <div id="msgGlobal" style="display:none;"></div>

        <div class="table-wrapper">
            <table>
                <thead><tr>
                    <th>Nombre</th><th>CUIT</th><th>Teléfono</th>
                    <th>Email</th><th>Dirección</th><th>Contacto</th><th class="text-center">Acciones</th>
                </tr></thead>
                <tbody id="tbodyProveedores"></tbody>
            </table>
        </div>
    </main>
</div>

<!-- MODAL -->
<div id="modalProveedor" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitulo">Proveedor</h3>
            <button class="btn-close-modal" id="btnCerrarModal">?</button>
        </div>
        <div class="modal-body">
            <div id="modalMsg" class="full" style="display:none;"></div>
            <div class="form-grupo full">
                <label>Nombre *</label>
                <input type="text" id="fNombre" placeholder="Nombre del proveedor..." maxlength="200" />
            </div>
            <div class="form-grupo">
                <label>CUIT</label>
                <input type="text" id="fCuit" placeholder="20-12345678-9" maxlength="20" />
            </div>
            <div class="form-grupo">
                <label>Teléfono</label>
                <input type="text" id="fTelefono" placeholder="(011) 1234-5678" maxlength="50" />
            </div>
            <div class="form-grupo">
                <label>Email</label>
                <input type="email" id="fEmail" placeholder="correo@empresa.com" maxlength="100" />
            </div>
            <div class="form-grupo">
                <label>Dirección</label>
                <input type="text" id="fDireccion" placeholder="Calle 123, Ciudad" maxlength="200" />
            </div>
            <div class="form-grupo">
                <label>Contacto</label>
                <input type="text" id="fContacto" placeholder="Nombre del contacto" maxlength="100" />
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" id="btnCancelar">Cancelar</button>
            <button class="btn-save" id="btnGuardar">Guardar</button>
        </div>
    </div>
</div>

<script src="/js/proveedores.js"></script>
</body>
</html>
